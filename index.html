<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Car Dodge – a 2D car dodging arcade game built with HTML5 Canvas and JavaScript.">
  <title>Car Dodge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="cabinet">
    <header class="hud">
      <h1>Car Dodge</h1>
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Best</span><b id="best">0</b></div>
      <div class="stat"><span>km/h</span><b id="kmh">0</b></div>
      <button class="sound" id="muteBtn" aria-pressed="true" aria-label="Sound">♪ ON</button>
    </header>

    <div class="stage">
      <canvas id="game" width="400" height="640" aria-label="Car Dodge road"></canvas>
      <div class="overlay">
        <div class="card" id="menu">
          <h2>Car Dodge</h2>
          <p>Weave through traffic. Pass a car +10, grab a coin +20. Power-ups: shield, magnet, slow-mo. Every 300 points is a new level.</p>
          <div class="picker" data-picker></div>
          <p class="keys-hint">Steer <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> · Pause <kbd>P</kbd> · Sound <kbd>M</kbd></p>
          <button id="startBtn">Start engine</button>
        </div>
        <div class="card" id="paused" hidden>
          <h2>Paused</h2>
          <button id="resumeBtn">Resume</button>
        </div>
        <div class="card crash" id="over" hidden>
          <h2>Crashed</h2>
          <div class="big" id="finalScore">0</div>
          <div class="newbest" id="newBest" hidden>New best score</div>
          <p id="overStats"></p>
          <div class="picker" data-picker></div>
          <button id="restartBtn">Drive again</button>
          <p class="keys-hint">or press <kbd>Space</kbd></p>
        </div>
      </div>
    </div>

    <div class="pedals">
      <button id="leftBtn" aria-label="Steer left">◀</button>
      <button id="rightBtn" aria-label="Steer right">▶</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
